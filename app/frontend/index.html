<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research Assistant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="mesh-bg" aria-hidden="true">
  <div class="mesh-blob blob-1"></div>
  <div class="mesh-blob blob-2"></div>
  <div class="mesh-blob blob-3"></div>
</div>
<div class="particles" id="particles" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<aside class="sidebar" id="sidebar">
  <button class="new-chat-btn" id="newChatBtn">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    New chat
  </button>
  <div class="sidebar-label">Chats</div>
  <input class="conv-search" id="convSearch" type="search" placeholder="Search conversations…" autocomplete="off" spellcheck="false">
  <div class="conv-list" id="convList"></div>
  <button class="docs-btn" id="docsBtn">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
    Documents
  </button>
  <button class="docs-btn" id="analyticsBtn" title="Open the analytics dashboard">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>
    Analytics
  </button>
  <button class="docs-btn" id="settingsBtn" title="Open settings">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    Settings
  </button>
</aside>

<div class="modal-backdrop" id="docsModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="docsModalTitle">
    <div class="modal-header">
      <h2 id="docsModalTitle">All documents</h2>
      <button class="icon-btn" id="docsModalClose" aria-label="Close">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="docsModalBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="telemetryModal" hidden>
  <div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="telemetryModalTitle">
    <div class="modal-header">
      <div>
        <h2 id="telemetryModalTitle">Analytics</h2>
        <div class="modal-subtitle" id="telemetryStatus"></div>
      </div>
      <div class="modal-actions">
        <button class="icon-btn" id="telemetryRefresh" title="Refresh" aria-label="Refresh logs">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
        </button>
        <button class="icon-btn" id="telemetryClear" title="Clear logs" aria-label="Clear telemetry logs">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
        <button class="icon-btn" id="telemetryModalClose" aria-label="Close">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>
    <div class="modal-body" id="telemetryBody"></div>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="modal-header">
      <h2 id="settingsModalTitle">Settings</h2>
      <button class="icon-btn" id="settingsModalClose" aria-label="Close">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" style="padding:12px 16px 16px">
      <div class="sec-title">Default model</div>
      <div class="model-field">
        <label for="setProvider">Provider</label>
        <select id="setProvider">
          <option value="google_genai">Google Gemini</option>
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic Claude</option>
        </select>
      </div>
      <div class="model-field" style="margin-top:8px">
        <label for="setModel">Model</label>
        <input type="text" id="setModel" placeholder="e.g. gemini-3.5-flash-lite" autocomplete="off" spellcheck="false">
      </div>
      <div class="model-field" style="margin-top:8px">
        <label for="setApiKey">API key <span style="text-transform:none;letter-spacing:0">(leave blank to use .env)</span></label>
        <input type="password" id="setApiKey" placeholder="" autocomplete="new-password" spellcheck="false">
      </div>
      <button class="model-save" id="setLlmSave">Save model</button>

      <div class="sec-title" style="padding-top:18px">Retrieval defaults</div>
      <div class="model-field">
        <label for="setSearchType">Search type</label>
        <select id="setSearchType">
          <option value="hybrid">Hybrid</option>
          <option value="dense">Dense</option>
          <option value="sparse">Sparse</option>
        </select>
      </div>
      <div class="model-field" style="margin-top:8px">
        <label for="setSearchDepth">Web search depth</label>
        <select id="setSearchDepth">
          <option value="basic">Basic</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>
      <div class="model-field" style="margin-top:8px">
        <label for="setRetrieveLimit">Retrieval limit (1–50)</label>
        <input type="number" id="setRetrieveLimit" min="1" max="50" step="1">
      </div>
      <div class="settings-row">
        <input type="checkbox" id="setRerank">
        <label for="setRerank" style="cursor:pointer">Rerank retrieved chunks</label>
      </div>
      <button class="model-save" id="setRetrievalSave">Save retrieval</button>

      <div class="settings-status" id="settingsStatus"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="compareModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="compareModalTitle">
    <div class="modal-header">
      <h2 id="compareModalTitle">Compare documents</h2>
      <button class="icon-btn" id="compareModalClose" aria-label="Close">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="compare-select" id="compareSelect"></div>
      <textarea class="compare-note" id="compareNote" rows="2" placeholder="What would you like to compare about these documents? (optional)"></textarea>
      <button class="compare-go" id="compareGo">Compare selected</button>
    </div>
  </div>
</div>

<main class="main">
  <div class="main-header">
    <button class="icon-btn hamburger" id="sidebarToggle" aria-label="Toggle sidebar">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
    </button>
    <span id="mainHeader">New chat</span>
    <div class="header-actions" id="headerActions" hidden>
      <button class="icon-btn" id="renameBtn" title="Rename conversation" aria-label="Rename conversation">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
      </button>
      <button class="icon-btn" id="exportMdBtn" title="Export as Markdown" aria-label="Export as Markdown">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
      </button>
      <button class="icon-btn" id="exportJsonBtn" title="Export as JSON" aria-label="Export as JSON">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      </button>
    </div>
  </div>
  <div class="messages" id="messages">
    <div class="empty-state">
      <div class="hero-wrap" id="heroWrap">
        <div class="hero-text" id="heroText">How can I help you today?</div>
      </div>
      <div class="small">Ask a question, or attach a document to search over it.</div>
      <!-- clicking one fills the composer rather than sending, the prompts
           have blanks to finish and it avoids firing off an accidental run -->
      <div class="chips">
        <button class="chip" data-prompt="Summarize the key points of the document I attached.">Summarize a document</button>
        <button class="chip" data-prompt="Search the web for recent developments in ">Search the web</button>
        <button class="chip" data-prompt="Explain , step by step, in plain language.">Explain a concept</button>
        <button class="chip" data-prompt="Compare  and , with the trade-offs of each.">Compare two options</button>
      </div>
    </div>
  </div>
  <div class="composer-wrap">
    <div class="composer-tools">
      <select class="mode-select" id="sourceSelect" title="Knowledge source" aria-label="Knowledge source">
        <option value="auto">Auto</option>
        <option value="documents">Documents</option>
        <option value="web">Web</option>
        <option value="chat">Chat only</option>
      </select>
      <button class="advanced-btn" id="advancedBtn" type="button">Retrieval</button>
      <button class="advanced-btn" id="compareBtn" type="button">Compare docs</button>
      <div class="mode-toggle" role="group" aria-label="Response mode">
        <button type="button" class="mode-toggle-btn active" data-mode="fast">Fast</button>
        <button type="button" class="mode-toggle-btn" data-mode="thinking">Thinking</button>
      </div>
    </div>
    <div class="advanced-popover" id="advancedPopover" hidden>
      <div class="model-field">
        <label for="reqSearchType">Search type</label>
        <select id="reqSearchType">
          <option value="">Default</option>
          <option value="hybrid">Hybrid</option>
          <option value="dense">Dense</option>
          <option value="sparse">Sparse</option>
        </select>
      </div>
      <div class="model-field">
        <label for="reqSearchDepth">Web depth</label>
        <select id="reqSearchDepth" title="Web search depth used by the web search provider">
          <option value="">Default</option>
          <option value="basic">Basic</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>
      <div class="model-field">
        <label for="reqRetrieveLimit">Limit (1–50)</label>
        <input type="number" id="reqRetrieveLimit" min="1" max="50" step="1" placeholder="Default">
      </div>
      <label class="adv-check">
        <input type="checkbox" id="reqRerank"> Rerank
      </label>
    </div>
    <div class="composer">
      <button class="icon-btn" id="attachBtn" title="Attach document" aria-label="Attach document">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input type="file" id="fileInput" hidden>
      <textarea id="input" rows="1" placeholder="How can I help you today?"></textarea>
      <button class="send-btn" id="sendBtn" title="Send" aria-label="Send message" disabled>
        <svg class="ico send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        <svg class="ico stop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </div>
    <div class="hint">Documents you attach get indexed into this conversation's knowledge base.</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<!-- all four are optional, see the has* flags below. if a CDN is blocked
     the chat still works, it just looks plainer -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

<script type="module" src="js/main.js"></script>
</body>
</html>
