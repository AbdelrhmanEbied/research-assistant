[project]
name = "research-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "fastapi[standard]>=0.140.7",
    "fastembed>=0.8.0",
    "google-api-core>=2.33.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.2",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-voyageai>=0.4.0",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.10.10",
    "loguru>=0.7.3",
    "orjson>=3.11.9",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sentence-transformers>=5.6.1",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.60.0",
    "tavily-python>=0.7.27",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "tqdm>=4.70.0",
    "uvicorn>=0.51.0",
    "voyageai>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "rag", "api"]
